<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0b">
<title>Today</title>
<script src="lock.js"></script>
<link rel="stylesheet" href="simple.css">
</head>
<body>
<main>
  <h1 id="hello">Today</h1>
  <div class="sub" id="date"></div>

  <div class="card">
    <div class="label">The 3 checks</div>
    <div id="checks"></div>
    <p class="rule">Never miss twice. One miss is normal.</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="label" style="margin:0">This week</div>
      <span class="pill" id="weekPill"></span>
    </div>
    <div class="big" id="weekScore">0/21</div>
    <div class="bar"><i id="weekBar" style="width:0%"></i></div>
    <div class="week" id="week"></div>
  </div>

  <div class="card">
    <div class="label">To do (max 3)</div>
    <ul class="list" id="todos"></ul>
    <form class="todo" id="todoForm">
      <input id="todoIn" placeholder="One thing that moves money or body" autocomplete="off">
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="foot" id="foot"></div>
</main>

<script>
(function () {
  const CHECKS = [
    ['gym', 'Gym', 'or planned rest day'],
    ['money', '1 hour money work', 'closing, calls, replying to leads. Not editing or building tools'],
    ['clean', 'Clean day', 'no porn, no motivation content']
  ];
  const LS = 'today_v1';
  const TODO = 'today_todos_v1';
  const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const write = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  // Day rolls over at 4 AM (late nights count for the day before).
  function dayKey(d) {
    const x = new Date(d.getTime() - 4 * 3600e3);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  }
  const now = new Date();
  const today = dayKey(now);

  let server = {};   // from data.json (Hermes nightly check-in log)
  let local = read(LS, {}); // taps on this phone

  // Server log wins for any day Hermes recorded; taps fill the rest.
  function day(k) {
    const s = server[k], l = local[k] || {};
    return {
      gym: s ? s.gym : l.gym, money: s ? s.money : l.money, clean: s ? s.clean : l.clean,
      fromHermes: !!s
    };
  }

  function renderChecks() {
    const d = day(today);
    document.getElementById('checks').innerHTML = CHECKS.map(([k, t, sub]) => {
      const v = d[k];
      const cls = v === true ? 'y' : v === false ? 'n' : '';
      const mark = v === true ? '✓' : v === false ? '✕' : '';
      return `<button class="check ${cls}" data-k="${k}" type="button"><span class="box">${mark}</span><span>${t}<small>${sub}</small></span></button>`;
    }).join('');
    document.querySelectorAll('.check').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      const cur = (local[today] || {})[k];
      const next = cur === undefined ? true : cur === true ? false : undefined; // tap: yes -> no -> blank
      local[today] = Object.assign({}, local[today]);
      if (next === undefined) delete local[today][k]; else local[today][k] = next;
      write(LS, local);
      if (server[today]) delete server[today]; // a tap today overrides until tonight's check-in
      render();
    });
  }

  function renderWeek() {
    // Monday-start week
    const base = new Date(now.getTime() - 4 * 3600e3);
    const dow = (base.getDay() + 6) % 7;
    const mon = new Date(base); mon.setDate(base.getDate() - dow);
    let total = 0, html = '', missesInRow = 0, prevMiss = false, twice = false;
    for (let i = 0; i < 7; i++) {
      const dt = new Date(mon); dt.setDate(mon.getDate() + i);
      const k = dayKey(new Date(dt.getTime() + 4 * 3600e3 + 1));
      const d = day(k);
      const known = ['gym', 'money', 'clean'].filter(x => d[x] !== undefined).length;
      const s = ['gym', 'money', 'clean'].filter(x => d[x] === true).length;
      total += s;
      const future = k > today;
      html += `<div>${'MTWTFSS'[i]}<b class="${!future && known ? 's' + s : ''}">${future || !known ? '' : s}</b></div>`;
    }
    document.getElementById('week').innerHTML = html;
    document.getElementById('weekScore').textContent = total + '/21';
    document.getElementById('weekBar').style.width = Math.round(total / 21 * 100) + '%';
    const daysIn = dow + 1, pace = daysIn * 3;
    const pill = document.getElementById('weekPill');
    pill.textContent = total >= pace * 0.8 ? 'on pace' : 'behind pace';
    pill.className = 'pill ' + (total >= pace * 0.8 ? 'ok' : 'warn');
  }

  function renderTodos() {
    const list = read(TODO, []);
    const ul = document.getElementById('todos');
    ul.innerHTML = list.map((t, i) => `<li class="${t.done ? 'done' : ''}"><input type="checkbox" data-i="${i}" ${t.done ? 'checked' : ''}><span></span><button data-x="${i}" aria-label="Delete">×</button></li>`).join('');
    ul.querySelectorAll('li span').forEach((s, i) => s.textContent = list[i].text);
    ul.querySelectorAll('input').forEach(c => c.onchange = () => { list[c.dataset.i].done = c.checked; write(TODO, list); renderTodos(); });
    ul.querySelectorAll('button').forEach(b => b.onclick = () => { list.splice(b.dataset.x, 1); write(TODO, list); renderTodos(); });
    document.getElementById('todoIn').disabled = list.filter(t => !t.done).length >= 3;
    document.getElementById('todoIn').placeholder = list.filter(t => !t.done).length >= 3 ? 'Finish one first' : 'One thing that moves money or body';
  }
  document.getElementById('todoForm').onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById('todoIn').value.trim();
    if (!v) return;
    const list = read(TODO, []);
    if (list.filter(t => !t.done).length >= 3) return;
    list.push({ text: v, done: false }); write(TODO, list);
    document.getElementById('todoIn').value = ''; renderTodos();
  };

  function render() { renderChecks(); renderWeek(); }

  const h = now.getHours();
  document.getElementById('hello').textContent = h < 12 ? 'Morning, Fernando' : h < 18 ? 'Afternoon, Fernando' : 'Tonight, Fernando';
  document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  render(); renderTodos();

  fetch('data.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    server = d.log || {};
    // Taps from today stay until Hermes logs today.
    render();
    document.getElementById('foot').textContent = d.updated ? 'Hermes check-ins synced ' + d.updated : '';
  }).catch(() => {});
})();
</script>
<script src="nav.js"></script>
</body>
</html>
